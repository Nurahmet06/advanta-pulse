<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADVANTA Pulse — Create Test</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body class="student-page">

<div class="student-layout">


    <!-- SIDEBAR -->

    <aside class="student-sidebar">

        <div class="student-logo">
            ADVANTA <span>Pulse</span>
        </div>


        <nav class="student-nav">

            <a
                href="staff-home.html"
                class="student-nav-link"
            >
                <i class="bi bi-house"></i>

                <span data-i18n="staffHome">
                    Главная
                </span>
            </a>


            <a
                href="staff-tests.html"
                class="student-nav-link"
            >
                <i class="bi bi-clipboard-check"></i>

                <span data-i18n="myTests">
                    Мои тесты
                </span>
            </a>


            <a
                href="create-test.html"
                class="student-nav-link active"
            >
                <i class="bi bi-plus-circle"></i>

                <span data-i18n="createTest">
                    Создать тест
                </span>
            </a>


            <a
                href="staff-classes.html"
                class="student-nav-link"
            >
                <i class="bi bi-people"></i>

                <span data-i18n="classes">
                    Классы
                </span>
            </a>


            <a
                href="staff-results.html"
                class="student-nav-link"
            >
                <i class="bi bi-bar-chart"></i>

                <span data-i18n="studentResults">
                    Результаты учеников
                </span>
            </a>


            <a
                href="staff-analytics.html"
                class="student-nav-link"
            >
                <i class="bi bi-graph-up-arrow"></i>

                <span data-i18n="analytics">
                    Аналитика
                </span>
            </a>

        </nav>


        <a
            href="index.html"
            class="student-nav-link logout-link"
        >
            <i class="bi bi-box-arrow-left"></i>

            <span data-i18n="logout">
                Выйти
            </span>
        </a>

    </aside>



    <!-- MAIN -->

    <main class="student-main">


        <!-- HEADER -->

        <div class="student-header">

            <div>

                <h2
                    class="fw-bold mb-1"
                    data-i18n="createTest"
                >
                    Создать тест
                </h2>

                <p class="text-secondary mb-0">
                    ADVANTA Pulse
                </p>

            </div>


            <div class="d-flex align-items-center gap-3">

                <select
                    id="languageSelect"
                    class="form-select language-select"
                >
                    <option value="ru">RU</option>
                    <option value="kz">KZ</option>
                    <option value="en">EN</option>
                </select>


                <div class="student-avatar">
                    <i class="bi bi-person"></i>
                </div>

            </div>

        </div>



        <!-- TEST SETTINGS -->

        <div class="content-card mb-4">

            <h4 class="fw-bold mb-4">
                <span data-i18n="createTest">
                    Создать тест
                </span>
            </h4>


            <div class="row g-3">


                <!-- TEST NAME -->

                <div class="col-md-6">

                    <label
                        class="form-label"
                        data-i18n="testName"
                    >
                        Название теста
                    </label>

                    <input
                        type="text"
                        id="testName"
                        class="form-control form-control-lg"
                        placeholder="Обыкновенные дроби"
                    >

                </div>



                <!-- SUBJECT -->

                <div class="col-md-6">

                    <label
                        class="form-label"
                        data-i18n="subject"
                    >
                        Предмет
                    </label>

                    <select
                        id="subject"
                        class="form-select form-select-lg"
                    >

                        <option value="math" data-i18n="math">
                            Математика
                        </option>

                        <option value="english" data-i18n="english">
                            Английский язык
                        </option>

                        <option value="kazakh" data-i18n="kazakh">
                            Казахский язык
                        </option>

                        <option value="physics" data-i18n="physics">
                            Физика
                        </option>

                        <option value="chemistry" data-i18n="chemistry">
                            Химия
                        </option>

                        <option value="biology" data-i18n="biology">
                            Биология
                        </option>

                        <option value="history" data-i18n="history">
                            История
                        </option>

                        <option value="geography" data-i18n="geography">
                            География
                        </option>

                        <option value="informatics" data-i18n="informatics">
                            Информатика
                        </option>

                    </select>

                </div>



                <!-- CLASS -->

                <div class="col-md-4">

                    <label
                        class="form-label"
                        data-i18n="class"
                    >
                        Класс
                    </label>

                    <select
                        id="classSelect"
                        class="form-select form-select-lg"
                    >
                        <option>5А</option>
                        <option>5Б</option>
                        <option>5В</option>
                        <option>6А</option>
                        <option>6Б</option>
                        <option>7А</option>
                    </select>

                </div>



                <!-- DEADLINE -->

                <div class="col-md-4">

                    <label
                        class="form-label"
                        data-i18n="deadline"
                    >
                        Дедлайн
                    </label>

                    <input
                        type="datetime-local"
                        id="deadline"
                        class="form-control form-control-lg"
                    >

                </div>



                <!-- PASSING SCORE -->

                <div class="col-md-4">

                    <label
                        class="form-label"
                        data-i18n="threshold"
                    >
                        Порог
                    </label>

                    <div class="input-group input-group-lg">

                        <input
                            type="number"
                            id="passingScore"
                            class="form-control"
                            value="60"
                            min="0"
                            max="100"
                        >

                        <span class="input-group-text">
                            /100
                        </span>

                    </div>

                </div>

            </div>

        </div>



        <!-- QUESTIONS -->

        <div class="content-card">

            <div
                class="d-flex justify-content-between align-items-center mb-4"
            >

                <h4 class="fw-bold mb-0">

                    <span data-i18n="questions">
                        Вопросы
                    </span>

                </h4>


                <button
                    id="addQuestionBtn"
                    type="button"
                    class="btn btn-outline-primary"
                >

                    <i class="bi bi-plus-lg"></i>

                    +

                </button>

            </div>



            <div id="questionsContainer">

                <!-- JS добавит сюда вопросы -->

            </div>



            <!-- SAVE -->

            <div
                class="d-flex justify-content-end gap-2 mt-4"
            >

                <a
                    href="staff-tests.html"
                    class="btn btn-outline-secondary"
                >

                    <span data-i18n="cancel">
                        Отмена
                    </span>

                </a>


                <button
                    id="saveTestBtn"
                    type="button"
                    class="btn btn-primary"
                >

                    <i class="bi bi-save me-1"></i>

                    <span data-i18n="save">
                        Сохранить
                    </span>

                </button>

            </div>

        </div>


    </main>

</div>



<!-- LANGUAGE -->

<script src="js/language.js"></script>


<!-- CREATE TEST LOGIC -->

<script src="js/create-test.js"></script>


</body>
</html>

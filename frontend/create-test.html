<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADVANTA Pulse — Create Test</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body class="student-page">

<div class="student-layout">


    <!-- SIDEBAR -->

    <aside class="student-sidebar">

        <div class="student-logo">
            ADVANTA <span>Pulse</span>
        </div>


        <nav class="student-nav">

            <a
                href="staff-home.html"
                class="student-nav-link"
            >
                <i class="bi bi-house"></i>

                <span data-i18n="staffHome">
                    Главная
                </span>
            </a>


            <a
                href="staff-tests.html"
                class="student-nav-link"
            >
                <i class="bi bi-clipboard-check"></i>

                <span data-i18n="myTests">
                    Мои тесты
                </span>
            </a>


            <a
                href="staff-classes.html"
                class="student-nav-link active"
            >
                <i class="bi bi-people"></i>

                <span data-i18n="classes">
                    Классы
                </span>
            </a>


            <a
                href="staff-results.html"
                class="student-nav-link"
            >
                <i class="bi bi-bar-chart"></i>

                <span data-i18n="studentResults">
                    Результаты учеников
                </span>
            </a>


            <a
                href="staff-analytics.html"
                class="student-nav-link"
            >
                <i class="bi bi-graph-up-arrow"></i>

                <span data-i18n="analytics">
                    Аналитика
                </span>
            </a>

        </nav>


        <a
            href="index.html"
            class="student-nav-link logout-link"
        >
            <i class="bi bi-box-arrow-left"></i>

            <span data-i18n="logout">
                Выйти
            </span>
        </a>

    </aside>



    <!-- MAIN -->

    <main class="student-main">


        <!-- HEADER -->

        <div class="student-header">

            <div>

                <h2
                    id="pageTitle"
                    class="fw-bold mb-1"
                >
                    Создать тест
                </h2>

                <p
                    id="pageSubtitle"
                    class="text-secondary mb-0"
                >
                    ADVANTA Pulse
                </p>

            </div>


            <div class="d-flex align-items-center gap-3">

                <select
                    id="languageSelect"
                    class="form-select language-select"
                >
                    <option value="ru">RU</option>
                    <option value="kz">KZ</option>
                    <option value="en">EN</option>
                </select>


                <div class="student-avatar">
                    <i class="bi bi-person"></i>
                </div>

            </div>

        </div>



        <!-- BACK -->

        <div class="mb-4">

            <a
                id="backToClass"
                href="staff-classes.html"
                class="text-decoration-none"
            >
                <i class="bi bi-arrow-left me-1"></i>

                <span id="backText">
                    Назад в класс
                </span>
            </a>

        </div>



        <form id="createTestForm">


            <!-- TEST SETTINGS -->

            <div class="content-card mb-4">

                <h4
                    id="settingsTitle"
                    class="fw-bold mb-4"
                >
                    Настройки теста
                </h4>


                <div class="row g-3">


                    <!-- NAME -->

                    <div class="col-lg-8">

                        <label
                            for="testName"
                            class="form-label"
                            data-i18n="testName"
                        >
                            Название теста
                        </label>

                        <input
                            type="text"
                            id="testName"
                            class="form-control"
                            required
                        >

                    </div>



                    <!-- SUBJECT -->

                    <div class="col-lg-4">

                        <label
                            for="subjectDisplay"
                            class="form-label"
                            data-i18n="subject"
                        >
                            Предмет
                        </label>

                        <input
                            type="text"
                            id="subjectDisplay"
                            class="form-control"
                            readonly
                        >

                    </div>



                    <!-- CLASS - FIXED -->

                    <div class="col-lg-4">

                        <label
                            for="classDisplay"
                            class="form-label"
                            data-i18n="class"
                        >
                            Класс
                        </label>

                        <div class="input-group">

                            <input
                                type="text"
                                id="classDisplay"
                                class="form-control"
                                readonly
                            >

                            <span
                                class="input-group-text"
                                title="Класс зафиксирован"
                            >
                                <i class="bi bi-lock"></i>
                            </span>

                        </div>

                    </div>



                    <!-- DEADLINE -->

                    <div class="col-lg-5">

                        <label
                            for="deadline"
                            class="form-label"
                            data-i18n="deadline"
                        >
                            Дедлайн
                        </label>

                        <input
                            type="datetime-local"
                            id="deadline"
                            class="form-control"
                        >

                    </div>



                    <!-- PASSING SCORE -->

                    <div class="col-lg-3">

                        <label
                            for="passingScore"
                            class="form-label"
                            data-i18n="threshold"
                        >
                            Порог
                        </label>

                        <div class="input-group">

                            <input
                                type="number"
                                id="passingScore"
                                class="form-control"
                                min="0"
                                max="100"
                                value="60"
                                required
                            >

                            <span class="input-group-text">
                                /100
                            </span>

                        </div>

                    </div>


                </div>

            </div>



            <!-- TIME LIMIT -->

            <div class="content-card mb-4">

                <h4
                    id="timeSettingsTitle"
                    class="fw-bold mb-3"
                >
                    Время прохождения
                </h4>


                <div class="d-flex flex-column gap-3">


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="timeMode"
                            id="timeUnlimited"
                            value="unlimited"
                            checked
                        >

                        <label
                            id="timeUnlimitedLabel"
                            class="form-check-label"
                            for="timeUnlimited"
                        >
                            Без ограничения по времени
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="timeMode"
                            id="timeLimited"
                            value="limited"
                        >

                        <label
                            id="timeLimitedLabel"
                            class="form-check-label"
                            for="timeLimited"
                        >
                            Ограничить время
                        </label>

                    </div>


                    <div
                        id="timeLimitWrapper"
                        class="d-none"
                        style="max-width: 300px;"
                    >

                        <label
                            id="timeLimitLabel"
                            for="timeLimitMinutes"
                            class="form-label"
                        >
                            Время на прохождение
                        </label>


                        <div class="input-group">

                            <input
                                type="number"
                                id="timeLimitMinutes"
                                class="form-control"
                                min="1"
                                max="300"
                                placeholder="25"
                            >

                            <span
                                id="minutesSuffix"
                                class="input-group-text"
                            >
                                мин.
                            </span>

                        </div>


                        <div
                            id="timeLimitHint"
                            class="form-text"
                        >
                            От 1 до 300 минут
                        </div>

                    </div>


                </div>

            </div>



            <!-- QUESTIONS -->

            <div class="content-card mb-4">

                <div
                    class="d-flex justify-content-between align-items-center mb-4"
                >

                    <div>

                        <h4
                            id="questionsTitle"
                            class="fw-bold mb-1"
                        >
                            Вопросы
                        </h4>

                        <p
                            id="questionsHint"
                            class="text-secondary mb-0"
                        >
                            Добавьте вопросы и отметьте правильный ответ
                        </p>

                    </div>


                    <button
                        type="button"
                        id="addQuestionBtn"
                        class="btn btn-outline-primary"
                    >
                        <i class="bi bi-plus-lg me-1"></i>

                        <span id="addQuestionText">
                            Добавить вопрос
                        </span>
                    </button>

                </div>


                <div id="questionsContainer">
                </div>

            </div>



            <!-- ACTIONS -->

            <div
                class="d-flex flex-wrap justify-content-between gap-3"
            >

                <a
                    id="cancelButton"
                    href="staff-classes.html"
                    class="btn btn-outline-secondary"
                >
                    <i class="bi bi-arrow-left me-1"></i>

                    <span data-i18n="cancel">
                        Отмена
                    </span>
                </a>


                <button
                    type="submit"
                    id="saveTestBtn"
                    class="btn btn-primary"
                >
                    <i class="bi bi-check-lg me-1"></i>

                    <span id="saveButtonText">
                        Сохранить тест
                    </span>
                </button>

            </div>


        </form>


    </main>

</div>


<script src="js/language.js"></script>
<script src="js/create-test.js"></script>

</body>

</html>

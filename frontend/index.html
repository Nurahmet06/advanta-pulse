<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADVANTA Pulse</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

<div
    class="container min-vh-100 d-flex align-items-center justify-content-center py-4"
>

    <div class="row w-100 justify-content-center">

        <div class="col-lg-5 col-md-7">


            <!-- LANGUAGE -->

            <div class="d-flex justify-content-end mb-3">

                <select
                    id="languageSelect"
                    class="form-select"
                    style="width: 95px;"
                >
                    <option value="ru">RU</option>
                    <option value="kz">KZ</option>
                    <option value="en">EN</option>
                </select>

            </div>


            <!-- LOGO -->

            <div class="text-center mb-4">

                <h1 class="fw-bold">
                    ADVANTA
                    <span class="text-primary">
                        Pulse
                    </span>
                </h1>


                <p
                    id="systemDescription"
                    class="text-secondary"
                >
                    Система срезов знаний и аналитики успеваемости
                </p>

            </div>



            <!-- LOGIN CARD -->

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5">

                    <h4
                        id="loginTitle"
                        class="fw-bold mb-4"
                    >
                        Вход в систему
                    </h4>


                    <!-- MESSAGE -->

                    <div
                        id="loginMessage"
                        class="alert d-none"
                        role="alert"
                    >
                    </div>


                    <form id="loginForm">


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                id="emailLabel"
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>


                            <input
                                type="email"
                                id="email"
                                class="form-control form-control-lg"
                                placeholder="Введите email"
                                autocomplete="email"
                                required
                            >

                        </div>



                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label
                                id="passwordLabel"
                                for="password"
                                class="form-label"
                            >
                                Пароль
                            </label>


                            <div class="input-group">

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control form-control-lg"
                                    placeholder="Введите пароль"
                                    autocomplete="current-password"
                                    required
                                >


                                <button
                                    type="button"
                                    id="togglePassword"
                                    class="btn btn-outline-secondary"
                                    aria-label="Показать пароль"
                                >
                                    <i
                                        id="passwordIcon"
                                        class="bi bi-eye"
                                    ></i>
                                </button>

                            </div>

                        </div>



                        <!-- LOGIN -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="btn btn-primary btn-lg w-100"
                        >
                            <span id="loginButtonText">
                                Войти
                            </span>
                        </button>

                    </form>



                    <!-- REGISTRATION -->

                    <div class="text-center mt-4">

                        <p
                            id="registrationQuestion"
                            class="mb-2"
                        >
                            Ученик и ещё нет аккаунта?
                        </p>


                        <a
                            href="student-register.html"
                            id="registrationButton"
                            class="btn btn-outline-primary w-100"
                        >
                            Зарегистрироваться
                        </a>

                    </div>


                </div>

            </div>



            <p class="text-center text-secondary mt-4 small">
                © 2026 ADVANTA.KZ
            </p>


        </div>

    </div>

</div>


<script src="js/language.js"></script>
<script src="js/app.js"></script>

<div class="text-center pb-4"><a href="staff-register.html" data-i18n="registrationLink">Регистрация сотрудника</a></div>
</body>

</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ADVANTA Pulse</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div class="row w-100 justify-content-center">

      <div class="col-lg-5 col-md-7">

        <div class="text-center mb-4">

          <h1 class="fw-bold">
            ADVANTA <span class="text-primary">Pulse</span>
          </h1>

          <p class="text-secondary">
            Система срезов знаний и аналитики успеваемости
          </p>

        </div>

        <div class="card shadow border-0 rounded-4">

          <div class="card-body p-5">

            <h4 class="fw-bold mb-4">
              Вход в систему
            </h4>

            <form id="loginForm">

              <div class="mb-3">

                <label class="form-label">
                  Email
                </label>

                <input
                  type="email"
                  id="email"
                  class="form-control form-control-lg"
                  placeholder="Введите email"
                  required
                >

              </div>

              <div class="mb-3">

                <label class="form-label">
                  Пароль
                </label>

                <input
                  type="password"
                  id="password"
                  class="form-control form-control-lg"
                  placeholder="Введите пароль"
                  required
                >

              </div>

              <button
                type="submit"
                class="btn btn-primary btn-lg w-100"
              >
                Войти
              </button>

            </form>

            <div class="text-center mt-4">

              <p class="mb-2">
                Ученик и ещё нет аккаунта?
              </p>

              <a
                href="student-register.html"
                class="btn btn-outline-primary w-100"
              >
                Зарегистрироваться
              </a>

            </div>

          </div>

        </div>

        <p class="text-center text-secondary mt-4 small">
          © 2026 ADVANTA.KZ
        </p>

      </div>

    </div>

  </div>


  <script src="js/app.js"></script>

</body>
</html>

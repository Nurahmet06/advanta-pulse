<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADVANTA Pulse — Все тесты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <div class="d-flex min-vh-100">

        <!-- SIDEBAR -->
        <aside class="bg-dark text-white p-3" style="width:250px;min-width:250px;">

            <h4 class="mb-4">
                ADVANTA <span class="text-primary">Pulse</span>
            </h4>

            <nav class="nav flex-column gap-2">

                <a id="navOverview" href="vice-principal-home.html" class="nav-link text-white">
                    <i class="bi bi-speedometer2 me-2"></i>
                    <span>Обзор</span>
                </a>

                <a id="navClasses" href="vice-principal-classes.html" class="nav-link text-white">
                    <i class="bi bi-diagram-3 me-2"></i>
                    <span>Все классы</span>
                </a>

                <a id="navTeachers" href="vice-principal-teachers.html" class="nav-link text-white">
                    <i class="bi bi-person-badge me-2"></i>
                    <span>Учителя</span>
                </a>

                <a id="navTests" href="vice-principal-tests.html" class="nav-link text-white bg-primary rounded">
                    <i class="bi bi-journal-check me-2"></i>
                    <span>Все тесты</span>
                </a>

                <a id="navResults" href="vice-principal-results.html" class="nav-link text-white">
                    <i class="bi bi-clipboard-data me-2"></i>
                    <span>Результаты</span>
                </a>

                <a id="navAnalytics" href="vice-principal-analytics.html" class="nav-link text-white">
                    <i class="bi bi-graph-up-arrow me-2"></i>
                    <span>Аналитика</span>
                </a>

            </nav>
        </aside>

        <!-- MAIN -->
        <main class="flex-grow-1 p-4">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h2 id="pageTitle">Все тесты</h2>

                    <p id="pageDescription" class="text-muted">
                        Мониторинг тестов всех учителей
                    </p>
                </div>

                <select id="languageSelect" class="form-select" style="width: 100px;" aria-label="Language">
                    <option value="ru">RU</option>
                    <option value="kz">KZ</option>
                    <option value="en">EN</option>
                </select>
            </div>

            <!-- STATISTICS -->
            <div class="row g-3 mb-4">

                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div id="totalTestsLabel" class="text-muted small">
                                Всего тестов
                            </div>

                            <h3 id="totalTests">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div id="publishedTestsLabel" class="text-muted small">
                                Опубликовано
                            </div>

                            <h3 id="publishedTests">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div id="completedResultsLabel" class="text-muted small">
                                Выполнений
                            </div>

                            <h3 id="completedResults">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <div id="averageScoreLabel" class="text-muted small">
                                Средний балл
                            </div>

                            <h3 id="averageScore">—</h3>
                        </div>
                    </div>
                </div>

            </div>

            <!-- FILTERS -->
            <div class="card mb-4">
                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label id="searchLabel" for="testSearch" class="form-label">
                                Поиск теста
                            </label>

                            <input id="testSearch" type="text" class="form-control" placeholder="Название теста">
                        </div>

                        <div class="col-md-3">
                            <label id="statusFilterLabel" for="statusFilter" class="form-label">
                                Статус
                            </label>

                            <select id="statusFilter" class="form-select">
                                <option value="all">Все статусы</option>
                                <option value="draft">Черновик</option>
                                <option value="published">Опубликован</option>
                                <option value="finished">Завершён</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label id="teacherFilterLabel" for="teacherFilter" class="form-label">
                                Учитель
                            </label>

                            <select id="teacherFilter" class="form-select">
                                <option value="all">Все учителя</option>
                            </select>
                        </div>

                    </div>

                </div>
            </div>

            <!-- TESTS TABLE -->
            <div class="card">
                <div class="card-body">

                    <h5 id="testsTitle" class="mb-3">
                        Список тестов
                    </h5>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>
                                <tr>
                                    <th id="testHeader">Тест</th>
                                    <th id="teacherHeader">Учитель</th>
                                    <th id="classesHeader">Классы</th>
                                    <th id="statusHeader">Статус</th>
                                    <th id="resultsHeader">Выполнений</th>
                                    <th id="scoreHeader">Средний балл</th>
                                    <th id="actionHeader">Действие</th>
                                </tr>
                            </thead>

                            <tbody id="testsTableBody">
                                <tr>
                                    <td colspan="7" class="text-center text-muted py-4">
                                        Загрузка данных...
                                    </td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                </div>
            </div>

        </main>
    </div>

    <script src="js/language.js"></script>
    <script src="js/vice-principal-tests.js"></script>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>

</body>

</html>

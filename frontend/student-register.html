<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Регистрация ученика — ADVANTA Pulse</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

  <div class="row w-100 justify-content-center">

    <div class="col-lg-6 col-md-8">

      <div class="text-center mb-4">

        <h1 class="fw-bold">
          ADVANTA <span class="text-primary">Pulse</span>
        </h1>

        <p class="text-secondary mb-0">
          Регистрация ученика
        </p>

      </div>


      <div class="card shadow border-0 rounded-4">

        <div class="card-body p-4 p-md-5">

          <form id="registerForm">

            <div class="row">

              <div class="col-md-6 mb-3">

                <label for="firstName" class="form-label">
                  Имя
                </label>

                <input
                  type="text"
                  id="firstName"
                  class="form-control form-control-lg"
                  autocomplete="given-name"
                  required
                >

              </div>


              <div class="col-md-6 mb-3">

                <label for="lastName" class="form-label">
                  Фамилия
                </label>

                <input
                  type="text"
                  id="lastName"
                  class="form-control form-control-lg"
                  autocomplete="family-name"
                  required
                >

              </div>

            </div>


            <!-- ВЫБОР КЛАССА -->

            <div class="mb-3">

              <label for="studentClass" class="form-label">
                Класс
              </label>

              <select
                id="studentClass"
                class="form-select form-select-lg"
                required
              >

                <option value="">
                  Выберите свой класс
                </option>

              </select>

              <div class="form-text">
                Выберите класс, в котором вы действительно учитесь.
                Учитель проверит заявку перед подтверждением.
              </div>

            </div>


            <div class="mb-3">

              <label for="registerEmail" class="form-label">
                Email
              </label>

              <input
                type="email"
                id="registerEmail"
                class="form-control form-control-lg"
                autocomplete="email"
                required
              >

            </div>


            <div class="mb-3">

              <label for="phone" class="form-label">
                Номер телефона
              </label>

              <input
                type="tel"
                id="phone"
                class="form-control form-control-lg"
                placeholder="+7 700 000 00 00"
                autocomplete="tel"
                required
              >

            </div>


            <div class="mb-3">

              <label for="registerPassword" class="form-label">
                Пароль
              </label>

              <input
                type="password"
                id="registerPassword"
                class="form-control form-control-lg"
                minlength="6"
                autocomplete="new-password"
                required
              >

              <div class="form-text">
                Минимум 6 символов
              </div>

            </div>


            <div class="mb-4">

              <label for="confirmPassword" class="form-label">
                Повторите пароль
              </label>

              <input
                type="password"
                id="confirmPassword"
                class="form-control form-control-lg"
                minlength="6"
                autocomplete="new-password"
                required
              >

            </div>


            <button
              type="submit"
              id="registerButton"
              class="btn btn-primary btn-lg w-100"
            >
              Отправить запрос
            </button>

          </form>


          <div
            id="registerMessage"
            class="alert alert-success border-0 rounded-4 mt-4 d-none"
          >

            <div class="fw-bold mb-1">
              Запрос отправлен
            </div>

            <div id="registerMessageText">
              После подтверждения учителем вы сможете войти в систему.
            </div>

          </div>


          <div class="text-center mt-4">

            <a href="index.html">
              Уже есть аккаунт? Войти
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<script src="js/register.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADVANTA Pulse — Class Analytics</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
            <a
                href="vice-principal-teachers.html"
                class="btn btn-outline-secondary"
                id="backButton"
            >
                ← Назад
            </a>

            <select
                id="languageSelect"
                class="form-select"
                style="max-width: 110px;"
                aria-label="Language"
            >
                <option value="ru">RU</option>
                <option value="kz">KZ</option>
                <option value="en">EN</option>
            </select>
        </div>

        <h2 id="pageTitle" class="fw-bold mb-2">
            Анализ класса
        </h2>

        <p id="classDescription" class="text-muted mb-4">
            Загрузка данных...
        </p>

        <div class="row g-3 mb-4">

            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div id="averageLabel" class="text-muted">
                            Средний балл
                        </div>
                        <h3 id="averageScore" class="mt-2">—</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div id="completedLabel" class="text-muted">
                            Завершено тестов
                        </div>
                        <h3 id="completedCount" class="mt-2">—</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div id="riskLabel" class="text-muted">
                            Результаты ниже порога
                        </div>
                        <h3 id="riskCount" class="mt-2">—</h3>
                    </div>
                </div>
            </div>

        </div>

        <section class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <h5 id="riskStudentsTitle" class="fw-semibold mb-3">
            Ученики группы риска
        </h5>

        <p id="riskStudentsDescription" class="text-muted">
            Ученики, не достигшие проходного порога хотя бы в одном тесте.
        </p>

        <div id="riskStudentsContent">
            <p class="text-muted">Загрузка данных...</p>
        </div>
    </div>
</section>

        <div class="card border-0 shadow-sm">
            <div class="card-body">

                <h5 id="resultsTitle" class="fw-semibold mb-3">
                    Результаты учеников
                </h5>

                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th id="studentHeader">Ученик</th>
                                <th id="testHeader">Тест</th>
                                <th id="scoreHeader">Балл</th>
                                <th id="thresholdHeader">Порог</th>
                                <th id="statusHeader">Статус</th>
                            </tr>
                        </thead>
                        <tbody id="analyticsTableBody">
                            <tr>
                                <td colspan="5" class="text-muted">
                                    Загрузка...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>

    <script src="js/language.js"></script>
    <script src="js/vice-principal-analytics.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADVANTA Pulse — Results</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
<div class="d-flex min-vh-100">

    <aside class="bg-dark text-white p-3"
           style="width:250px;min-width:250px;">

        <h4 class="mb-4">
            ADVANTA <span class="text-primary">Pulse</span>
        </h4>

        <nav class="nav flex-column gap-2">

            <a id="navOverview" href="vice-principal-home.html"
               class="nav-link text-white">
                <i class="bi bi-speedometer2 me-2"></i>
                <span>Обзор</span>
            </a>

            <a id="navClasses" href="vice-principal-classes.html"
               class="nav-link text-white">
                <i class="bi bi-diagram-3 me-2"></i>
                <span>Все классы</span>
            </a>

            <a id="navTeachers" href="vice-principal-teachers.html"
               class="nav-link text-white">
                <i class="bi bi-person-badge me-2"></i>
                <span>Учителя</span>
            </a>

            <a id="navTests" href="vice-principal-tests.html"
               class="nav-link text-white">
                <i class="bi bi-journal-check me-2"></i>
                <span>Все тесты</span>
            </a>

            <a id="navResults" href="vice-principal-results.html"
               class="nav-link text-white active bg-primary rounded">
                <i class="bi bi-clipboard-data me-2"></i>
                <span>Результаты</span>
            </a>

            <a id="navAnalytics" href="vice-principal-school-analytics.html""
               class="nav-link text-white">
                <i class="bi bi-graph-up-arrow me-2"></i>
                <span>Аналитика</span>
            </a>

        </nav>
    </aside>

    <main class="flex-grow-1 p-4">

        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h2 id="pageTitle">Результаты учеников</h2>
                <p id="pageDescription" class="text-muted">
                    Мониторинг результатов тестирования
                </p>
            </div>

            <select id="languageSelect"
                    class="form-select w-auto">
                <option value="ru">RU</option>
                <option value="kk">KZ</option>
                <option value="en">EN</option>
            </select>
        </div>

        <div class="row g-3 mb-4">

            <div class="col-md-3">
                <div class="card h-100">
                    <div class="card-body">
                        <div id="completedLabel" class="text-muted small">
                            Выполнено тестов
                        </div>
                        <h3 id="completedCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card h-100">
                    <div class="card-body">
                        <div id="averageLabel" class="text-muted small">
                            Средний балл
                        </div>
                        <h3 id="averageScore">—</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card h-100">
                    <div class="card-body">
                        <div id="passedLabel" class="text-muted small">
                            Прошли порог
                        </div>
                        <h3 id="passedCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card h-100">
                    <div class="card-body">
                        <div id="failedLabel" class="text-muted small">
                            Не прошли порог
                        </div>
                        <h3 id="failedCount">0</h3>
                    </div>
                </div>
            </div>

        </div>

        <div class="card mb-4">
            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label id="searchLabel" class="form-label">
                            Поиск ученика
                        </label>
                        <input id="studentSearch"
                               class="form-control"
                               placeholder="Имя ученика">
                    </div>

                    <div class="col-md-3">
                        <label id="classFilterLabel" class="form-label">
                            Класс
                        </label>
                        <select id="classFilter" class="form-select">
                            <option value="">Все классы</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label id="testFilterLabel" class="form-label">
                            Тест
                        </label>
                        <select id="testFilter" class="form-select">
                            <option value="">Все тесты</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label id="statusFilterLabel" class="form-label">
                            Статус
                        </label>
                        <select id="statusFilter" class="form-select">
                            <option value="">Все</option>
                            <option value="passed">Прошёл</option>
                            <option value="failed">Не прошёл</option>
                        </select>
                    </div>

                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">

                <h5 id="resultsTitle" class="mb-3">
                    Список результатов
                </h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">

                        <thead>
                        <tr>
                            <th id="studentHeader">Ученик</th>
                            <th id="classHeader">Класс</th>
                            <th id="testHeader">Тест</th>
                            <th id="teacherHeader">Учитель</th>
                            <th id="scoreHeader">Балл</th>
                            <th id="thresholdHeader">Порог</th>
                            <th id="statusHeader">Статус</th>
                        </tr>
                        </thead>

                        <tbody id="resultsTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">
                                Загрузка результатов...
                            </td>
                        </tr>
                        </tbody>

                    </table>
                </div>

            </div>
        </div>

    </main>
</div>

<script src="js/language.js"></script>
<script src="js/vice-principal-results.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADVANTA Pulse — Test</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body class="test-page">


<!-- ====================================================== -->
<!-- TOP BAR                                                -->
<!-- ====================================================== -->

<header class="test-topbar">

    <div class="student-logo">

        ADVANTA <span>Pulse</span>

    </div>


    <div class="d-flex align-items-center gap-4">


        <!-- QUESTION COUNTER -->

        <span
            id="questionCounter"
            class="text-white"
        >
            Вопрос 1 из 1
        </span>


        <!-- TIMER -->

        <span class="test-timer">

            <i class="bi bi-clock"></i>

            <span id="timer">
                20:00
            </span>

        </span>


        <!-- LANGUAGE -->

        <select
            id="languageSelect"
            class="form-select language-select"
        >

            <option value="ru">
                RU
            </option>

            <option value="kz">
                KZ
            </option>

            <option value="en">
                EN
            </option>

        </select>

    </div>

</header>



<!-- ====================================================== -->
<!-- MAIN                                                   -->
<!-- ====================================================== -->

<main class="test-container">


    <!-- TEST INFORMATION -->

    <div class="test-header">


        <!-- SUBJECT -->

        <span
            id="testSubject"
            class="subject-label"
        >
            Предмет
        </span>


        <!-- TEST NAME -->

        <h2
            id="testTitle"
        >
            Тест
        </h2>


        <!-- PASSING SCORE -->

        <p class="text-secondary mb-0">

            <span
                data-i18n="threshold"
            >
                Порог
            </span>

            :

            <strong id="testPassingScore">

                60/100

            </strong>

        </p>

    </div>



    <!-- ================================================== -->
    <!-- PROGRESS                                           -->
    <!-- ================================================== -->

    <div
        class="progress test-progress"
    >

        <div
            id="progressBar"
            class="progress-bar"
            role="progressbar"
            style="width: 0%"
        >
        </div>

    </div>



    <!-- ================================================== -->
    <!-- QUESTION                                           -->
    <!-- ================================================== -->

    <div class="question-card">


        <div class="question-number">

            <span data-i18n="question">

                Вопрос

            </span>

            <span id="questionNumber">

                1

            </span>

        </div>



        <!-- REAL QUESTION FROM TEACHER -->

        <h3 id="questionText">

            Загрузка вопроса...

        </h3>



        <!-- ANSWERS -->

        <div
            id="answersContainer"
            class="answers-container"
        >
        </div>


    </div>



    <!-- ================================================== -->
    <!-- NAVIGATION                                         -->
    <!-- ================================================== -->

    <div class="test-navigation">


        <!-- BACK -->

        <button
            id="prevBtn"
            type="button"
            class="btn btn-outline-secondary"
            disabled
        >

            <i class="bi bi-arrow-left"></i>

            <span data-i18n="back">

                Назад

            </span>

        </button>



        <!-- NEXT -->

        <button
            id="nextBtn"
            type="button"
            class="btn btn-primary"
        >

            <span data-i18n="next">

                Далее

            </span>

            <i class="bi bi-arrow-right"></i>

        </button>



        <!-- FINISH -->

        <button
            id="finishBtn"
            type="button"
            class="btn btn-success d-none"
        >

            <i class="bi bi-check-circle me-1"></i>

            <span data-i18n="finishTest">

                Завершить тест

            </span>

        </button>

    </div>


</main>



<!-- ====================================================== -->
<!-- FINISH MODAL                                           -->
<!-- ====================================================== -->

<div
    class="modal fade"
    id="finishModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div
        class="modal-dialog modal-dialog-centered"
    >

        <div
            class="modal-content border-0 rounded-4"
        >

            <div
                class="modal-body p-4 text-center"
            >


                <div class="finish-icon">

                    <i class="bi bi-check-circle"></i>

                </div>


                <h4
                    class="fw-bold mt-3"
                    data-i18n="finishConfirm"
                >
                    Завершить тест?
                </h4>


                <p
                    class="text-secondary"
                    data-i18n="finishWarning"
                >
                    После отправки изменить ответы будет нельзя.
                </p>


                <div class="d-flex gap-2 mt-4">


                    <button
                        type="button"
                        class="btn btn-outline-secondary w-50"
                        data-bs-dismiss="modal"
                    >

                        <span data-i18n="return">

                            Вернуться

                        </span>

                    </button>


                    <button
                        id="confirmFinishBtn"
                        type="button"
                        class="btn btn-primary w-50"
                    >

                        <span data-i18n="submit">

                            Отправить

                        </span>

                    </button>


                </div>

            </div>

        </div>

    </div>

</div>



<!-- ====================================================== -->
<!-- SCRIPTS                                                -->
<!-- ====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- ЕДИНАЯ СИСТЕМА ЯЗЫКОВ -->

<script src="js/language.js"></script>


<!-- REAL TEST LOGIC -->

<script src="js/test.js"></script>


</body>

</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADVANTA Pulse — adminStaffTitle</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body class="bg-light"><div class="d-flex min-vh-100"><aside class="bg-dark text-white p-3" style="width:250px;min-width:250px"><h4>ADVANTA <span class="text-primary">Pulse</span></h4><nav class="nav flex-column gap-2 mt-4"><a href="admin-home.html" class="nav-link text-white " ><i class="bi bi-speedometer2 me-2"></i><span data-i18n="navAdmin">Обзор</span></a><a href="admin-staff.html" class="nav-link text-white bg-primary rounded" aria-current=page><i class="bi bi-people me-2"></i><span data-i18n="navStaff">Сотрудники</span></a></nav></aside><main class="flex-grow-1 p-4" style="min-width:0"><div class="d-flex justify-content-between align-items-center mb-4"><h2 data-i18n="adminStaffTitle">adminStaffTitle</h2><select id="languageSelect" class="form-select" style="width:95px"><option value="ru">RU</option><option value="kz">KZ</option><option value="en">EN</option></select></div><p class="text-muted" data-i18n="adminStaffInfo"></p><p class="alert alert-warning" data-i18n="noPasswordShare"></p><div id="notice" role="status" class="alert d-none"></div><section class="card mb-4"><div class="card-body"><h5 data-i18n="accountCreate">Создать сотрудника</h5><form id="createStaffForm" class="row g-3"><div class="col-md-6"><input class="form-control" name="fullName" required data-i18n-placeholder="fullName" placeholder="ФИО"></div><div class="col-md-6"><input class="form-control" type="email" name="email" required placeholder="Email"></div><div class="col-md-6"><input class="form-control" type="password" name="password" minlength="8" required data-

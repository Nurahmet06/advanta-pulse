<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADVANTA Pulse — Classes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <div class="d-flex min-vh-100">

        <!-- Sidebar -->
        <aside class="bg-dark text-white p-3" style="width:250px;min-width:250px;">

            <h4 class="mb-4">
                ADVANTA <span class="text-primary">Pulse</span>
            </h4>

            <nav class="nav flex-column gap-2">

                <a id="navOverview" href="vice-principal-home.html" class="nav-link text-white">
                    <i class="bi bi-speedometer2 me-2"></i>
                    <span>Обзор</span>
                </a>

                <a id="navClasses" href="vice-principal-classes.html" class="nav-link text-white bg-primary rounded">
                    <i class="bi bi-diagram-3 me-2"></i>
                    <span>Все классы</span>
                </a>

                <a id="navTeachers" href="vice-principal-teachers.html" class="nav-link text-white">
                    <i class="bi bi-person-badge me-2"></i>
                    <span>Учителя</span>
                </a>

                <a id="navTests" href="vice-principal-tests.html" class="nav-link text-white">
                    <i class="bi bi-journal-check me-2"></i>
                    <span>Тесты</span>
                </a>

                <a id="navResults" href="vice-principal-results.html" class="nav-link text-white">
                    <i class="bi bi-clipboard-data me-2"></i>
                    <span>Результаты</span>
                </a>

                <a id="navAnalytics" href="vice-principal-analytics.html" class="nav-link text-white">
                    <i class="bi bi-graph-up-arrow me-2"></i>
                    <span>Аналитика</span>
                </a>

            </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-grow-1 p-4">

            <div class="d-flex justify-content-between
                       align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h2 id="pageTitle" class="fw-bold mb-1">
                        Все классы
                    </h2>
                    <p id="pageDescription" class="text-muted mb-0">
                        Мониторинг классов и успеваемости
                    </p>
                </div>

                <select id="languageSelect" class="form-select" style="width: 100px;" aria-label="Language">
                    <option value="ru">RU</option>
                    <option value="kz">KZ</option>
                    <option value="en">EN</option>
                </select>
            </div>

            <!-- Summary -->
            <div class="row g-3 mb-4">

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div id="totalClassesLabel" class="text-muted">
                                Всего классов
                            </div>
                            <h3 id="totalClasses" class="mt-2">—</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div id="totalStudentsLabel" class="text-muted">
                                Всего учеников
                            </div>
                            <h3 id="totalStudents" class="mt-2">—</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <div id="averageLabel" class="text-muted">
                                Средний балл
                            </div>
                            <h3 id="averageScore" class="mt-2">—</h3>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Search -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <label for="classSearch" id="searchLabel" class="form-label">
                        Поиск класса
                    </label>

                    <input type="search" id="classSearch" class="form-control" placeholder="Например, 5Б">
                </div>
            </div>

            <!-- Classes table -->
            <div class="card border-0 shadow-sm">
                <div class="card-body">

                    <h5 id="classesTitle" class="fw-semibold mb-3">
                        Список классов
                    </h5>

                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th id="classHeader">Класс</th>
                                    <th id="studentsHeader">Ученики</th>
                                    <th id="teacherHeader">Учитель</th>
                                    <th id="scoreHeader">Средний балл</th>
                                    <th id="statusHeader">Статус</th>
                                    <th id="actionHeader">Действие</th>
                                </tr>
                            </thead>

                            <tbody id="classesTableBody">
                                <tr>
                                    <td colspan="6" class="text-muted">
                                        Загрузка данных...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <script src="js/language.js"></script>
    <script src="js/vice-principal-classes.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADVANTA Pulse — Results</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/style.css">
</head>


<body class="student-page">

<div class="student-layout">


    <!-- SIDEBAR -->

    <aside class="student-sidebar">

        <div class="student-logo">
            ADVANTA <span>Pulse</span>
        </div>


        <nav class="student-nav">

            <a
                href="student-home.html"
                class="student-nav-link"
            >
                <i class="bi bi-house"></i>

                <span data-i18n="home">
                    Главная
                </span>
            </a>


            <a
                href="student-tasks.html"
                class="student-nav-link"
            >
                <i class="bi bi-clipboard-check"></i>

                <span data-i18n="tasks">
                    Задания
                </span>
            </a>


            <a
                href="student-results.html"
                class="student-nav-link active"
            >
                <i class="bi bi-bar-chart"></i>

                <span data-i18n="results">
                    Мои результаты
                </span>
            </a>

        </nav>


        <a
            href="#"
            id="logoutButton"
            class="student-nav-link logout-link"
        >
            <i class="bi bi-box-arrow-left"></i>

            <span data-i18n="logout">
                Выйти
            </span>
        </a>

    </aside>



    <!-- MAIN -->

    <main class="student-main">


        <!-- HEADER -->

        <div class="student-header">

            <div>

                <h2
                    class="fw-bold"
                    data-i18n="results"
                >
                    Мои результаты
                </h2>


                <p
                    class="text-secondary mb-0"
                    data-i18n="resultsHistory"
                >
                    История завершённых срезов
                </p>

            </div>


            <div class="d-flex align-items-center gap-3">

                <div class="text-end d-none d-md-block">

                    <strong id="studentName">
                        —
                    </strong>

                    <div
                        id="studentClass"
                        class="small text-secondary"
                    >
                        —
                    </div>

                </div>


                <select
                    id="languageSelect"
                    class="form-select language-select"
                >
                    <option value="ru">RU</option>
                    <option value="kz">KZ</option>
                    <option value="en">EN</option>
                </select>


                <div class="student-avatar">
                    <i class="bi bi-person"></i>
                </div>

            </div>

        </div>



        <!-- SUMMARY -->

        <div class="row g-4 mb-4">


            <div class="col-md-4">

                <div class="overview-card">

                    <div class="overview-icon">
                        <i class="bi bi-graph-up"></i>
                    </div>

                    <p data-i18n="averageResult">
                        Средний результат
                    </p>

                    <h2 id="averageResultValue">
                        —
                    </h2>

                </div>

            </div>



            <div class="col-md-4">

                <div class="overview-card">

                    <div class="overview-icon">
                        <i class="bi bi-trophy"></i>
                    </div>

                    <p data-i18n="bestResult">
                        Лучший результат
                    </p>

                    <h2 id="bestResultValue">
                        —
                    </h2>

                </div>

            </div>



            <div class="col-md-4">

                <div class="overview-card">

                    <div class="overview-icon">
                        <i class="bi bi-check2-circle"></i>
                    </div>

                    <p data-i18n="completedTests">
                        Завершено срезов
                    </p>

                    <h2 id="completedTestsValue">
                        0
                    </h2>

                </div>

            </div>


        </div>



        <!-- RESULTS -->

        <div id="resultsList"></div>


    </main>

</div>


<script src="js/language.js"></script>
<script src="js/student-results.js"></script>

</body>
</html>

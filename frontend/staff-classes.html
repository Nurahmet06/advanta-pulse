<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADVANTA Pulse — Классы</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body class="student-page">

<div class="student-layout">


    <!-- ===================================== -->
    <!-- SIDEBAR                               -->
    <!-- ===================================== -->

    <aside class="student-sidebar">

        <div class="student-logo">
            ADVANTA <span>Pulse</span>
        </div>


        <nav class="student-nav">


            <!-- HOME -->

            <a
                href="staff-home.html"
                class="student-nav-link"
            >

                <i class="bi bi-house"></i>

                <span data-i18n="staffHome">
                    Главная
                </span>

            </a>



            <!-- MY TESTS -->

            <a
                href="staff-tests.html"
                class="student-nav-link"
            >

                <i class="bi bi-clipboard-check"></i>

                <span data-i18n="myTests">
                    Мои тесты
                </span>

            </a>



            <!-- CLASSES -->

            <a
                href="staff-classes.html"
                class="student-nav-link active"
            >

                <i class="bi bi-people"></i>

                <span data-i18n="classes">
                    Классы
                </span>

            </a>



            <!-- RESULTS -->

            <a
                href="staff-results.html"
                class="student-nav-link"
            >

                <i class="bi bi-bar-chart"></i>

                <span data-i18n="studentResults">
                    Результаты учеников
                </span>

            </a>



            <!-- ANALYTICS -->

            <a
                href="staff-analytics.html"
                class="student-nav-link"
            >

                <i class="bi bi-graph-up-arrow"></i>

                <span data-i18n="analytics">
                    Аналитика
                </span>

            </a>


        </nav>



        <!-- LOGOUT -->

        <a
            href="index.html"
            class="student-nav-link logout-link"
        >

            <i class="bi bi-box-arrow-left"></i>

            <span data-i18n="logout">
                Выйти
            </span>

        </a>


    </aside>



    <!-- ===================================== -->
    <!-- MAIN                                  -->
    <!-- ===================================== -->

    <main class="student-main">


        <!-- HEADER -->

        <div class="student-header">

            <div>

                <p
                    class="student-welcome"
                    data-i18n="staffWelcome"
                >
                    Добро пожаловать
                </p>


                <h2
                    id="teacherName"
                    class="fw-bold mb-1"
                >
                    Айгуль Сериковна
                </h2>


                <p
                    id="teacherSubject"
                    class="text-secondary mb-0"
                >
                    Учитель • Математика
                </p>

            </div>



            <!-- LANGUAGE + PROFILE -->

            <div class="d-flex align-items-center gap-3">


                <select
                    id="languageSelect"
                    class="form-select language-select"
                >

                    <option value="ru">
                        RU
                    </option>

                    <option value="kz">
                        KZ
                    </option>

                    <option value="en">
                        EN
                    </option>

                </select>


                <div class="student-avatar">

                    <i class="bi bi-person"></i>

                </div>


            </div>

        </div>



        <!-- PAGE TITLE -->

        <div class="mb-4">

            <h3
                class="fw-bold mb-1"
                data-i18n="myClasses"
            >
                Мои классы
            </h3>


            <p
                id="classesDescription"
                class="text-secondary mb-0"
            >
                Выберите класс для перехода в его кабинет
            </p>

        </div>



        <!-- ===================================== -->
        <!-- CLASSES                               -->
        <!-- ===================================== -->

        <div
            id="classesContainer"
            class="row g-4"
        >

            <!-- JS вставляет карточки классов -->

        </div>


    </main>


</div>



<!-- LANGUAGE -->
<script src="js/language.js"></script>


<!-- CLASSES -->
<script src="js/staff-classes.js"></script>


</body>

</html>

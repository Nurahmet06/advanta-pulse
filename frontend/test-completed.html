<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADVANTA Pulse — Result</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body class="student-page">

<div
    class="container min-vh-100 d-flex align-items-center justify-content-center"
>

    <div class="result-completed-card text-center">


        <!-- LANGUAGE -->

        <div class="d-flex justify-content-end mb-4">

            <select
                id="languageSelect"
                class="form-select language-select"
            >
                <option value="ru">RU</option>
                <option value="kz">KZ</option>
                <option value="en">EN</option>
            </select>

        </div>


        <!-- LOGO -->

        <div class="student-logo result-logo mb-4">
            ADVANTA <span>Pulse</span>
        </div>


        <!-- ICON -->

        <div class="completed-icon">

            <i class="bi bi-check-circle-fill"></i>

        </div>


        <p
            id="completedText"
            class="text-secondary mt-4 mb-2"
        >
            Срез завершён
        </p>


        <!-- REAL TEST NAME -->

        <h2
            id="completedTestName"
            class="fw-bold"
        >
            Тест
        </h2>


        <!-- REAL SUBJECT -->

        <p
            id="completedSubject"
            class="text-secondary"
        >
            Математика
        </p>


        <!-- SCORE -->

        <div
            id="finalScore"
            class="score-circle result-score-circle mx-auto my-4"
        >

            <span id="scoreNumber">
                0
            </span>

        </div>


        <p class="mb-2">

            <span id="scoreLabel">
                Результат
            </span>

            :

            <strong id="scoreText">
                0/100
            </strong>

        </p>


        <!-- CORRECT ANSWERS -->

        <p class="mb-2">

            <span id="correctAnswersLabel">
                Правильных ответов
            </span>

            :

            <strong id="correctAnswersText">
                0 из 0
            </strong>

        </p>


        <!-- PASSING SCORE -->

        <p class="text-secondary">

            <span id="passingScoreLabel">
                Проходной балл
            </span>

            :

            <strong id="passingScoreText">
                60/100
            </strong>

        </p>


        <!-- STATUS -->

        <h4
            id="resultStatus"
            class="fw-bold mt-3"
        >
        </h4>


        <hr class="my-4">


        <p
            id="resultSavedText"
            class="text-secondary mb-2"
        >
            Результат сохранён.
        </p>


        <p
            id="answersHiddenText"
            class="text-secondary small"
        >
            Правильные ответы не отображаются.
        </p>


        <a
            href="student-home.html"
            class="btn btn-primary btn-lg mt-3 px-4"
        >

            <i class="bi bi-house me-1"></i>

            <span id="returnCabinetText">
                Вернуться в кабинет
            </span>

        </a>

    </div>

</div>


<script src="js/language.js"></script>
<script src="js/test-completed.js"></script>

</body>
</html>

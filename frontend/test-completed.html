<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADVANTA Pulse — Result</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body class="student-page">


<div
    class="container min-vh-100 d-flex align-items-center justify-content-center"
>

    <div
        class="result-completed-card text-center"
    >


        <!-- LANGUAGE -->

        <div
            class="d-flex justify-content-end mb-4"
        >

            <select
                id="languageSelect"
                class="form-select language-select"
            >

                <option value="ru">
                    RU
                </option>

                <option value="kz">
                    KZ
                </option>

                <option value="en">
                    EN
                </option>

            </select>

        </div>



        <!-- LOGO -->

        <div
            class="student-logo result-logo mb-4"
        >

            ADVANTA <span>Pulse</span>

        </div>



        <!-- COMPLETED -->

        <div class="completed-icon">

            <i
                class="bi bi-check-circle-fill"
            ></i>

        </div>


        <p
            class="text-secondary mt-4 mb-2"
            data-i18n="testCompleted"
        >
            Срез завершён
        </p>



        <!-- TEST -->

        <h2
            class="fw-bold"
            data-i18n="fractions"
        >
            Обыкновенные дроби
        </h2>


        <p
            class="text-secondary"
            data-i18n="math"
        >
            Математика
        </p>



        <!-- SCORE -->

        <div
            id="finalScore"
            class="score-circle result-score-circle mx-auto my-4"
        >

            <span id="scoreNumber">
                0
            </span>

        </div>



        <!-- SCORE TEXT -->

        <p class="mb-2">

            <span
                data-i18n="score"
            >
                Результат
            </span>

            :

            <strong id="scoreText">
                0/100
            </strong>

        </p>



        <!-- PASSING SCORE -->

        <p class="text-secondary">

            <span
                data-i18n="passingScore"
            >
                Проходной балл
            </span>

            :

            <strong>
                60/100
            </strong>

        </p>



        <!-- STATUS -->

        <h4
            id="resultStatus"
            class="fw-bold mt-3"
        >
        </h4>



        <hr class="my-4">



        <!-- MESSAGE -->

        <p
            class="text-secondary mb-2"
            data-i18n="resultSaved"
        >
            Результат сохранён.
        </p>


        <p
            class="text-secondary small"
            data-i18n="answersHidden"
        >
            Правильные ответы не отображаются.
        </p>



        <!-- BUTTON -->

        <a
            href="student-home.html"
            class="btn btn-primary btn-lg mt-3 px-4"
        >

            <i
                class="bi bi-house me-1"
            ></i>

            <span
                data-i18n="returnCabinet"
            >
                Вернуться в кабинет
            </span>

        </a>


    </div>

</div>



<!-- LANGUAGE -->
<script src="js/language.js"></script>

<!-- RESULT LOGIC -->
<script src="js/test-completed.js"></script>


</body>
</html>

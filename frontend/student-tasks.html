<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADVANTA Pulse — Assignments</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body class="student-page">

<div class="student-layout">


    <!-- SIDEBAR -->

    <aside class="student-sidebar">

        <div class="student-logo">
            ADVANTA <span>Pulse</span>
        </div>


        <nav class="student-nav">

            <a
                href="student-home.html"
                class="student-nav-link"
            >
                <i class="bi bi-house"></i>

                <span data-i18n="home">
                    Главная
                </span>
            </a>


            <a
                href="student-tasks.html"
                class="student-nav-link active"
            >
                <i class="bi bi-clipboard-check"></i>

                <span data-i18n="tasks">
                    Задания
                </span>
            </a>


            <a
                href="student-results.html"
                class="student-nav-link"
            >
                <i class="bi bi-bar-chart"></i>

                <span data-i18n="results">
                    Мои результаты
                </span>
            </a>

        </nav>


        <a
            href="#"
            id="logoutButton"
            class="student-nav-link logout-link"
        >
            <i class="bi bi-box-arrow-left"></i>

            <span data-i18n="logout">
                Выйти
            </span>
        </a>

    </aside>



    <!-- MAIN -->

    <main class="student-main">


        <!-- HEADER -->

        <div class="student-header">

            <div>

                <h2
                    class="fw-bold mb-1"
                    data-i18n="tasks"
                >
                    Задания
                </h2>

                <p
                    id="assignedTestsText"
                    class="text-secondary mb-0"
                >
                    Назначенные вашему классу срезы
                </p>

            </div>


            <div class="d-flex align-items-center gap-3">

                <div class="text-end d-none d-md-block">

                    <strong id="studentName">
                        —
                    </strong>

                    <div
                        id="studentClass"
                        class="small text-secondary"
                    >
                        —
                    </div>

                </div>


                <select
                    id="languageSelect"
                    class="form-select language-select"
                >
                    <option value="ru">RU</option>
                    <option value="kz">KZ</option>
                    <option value="en">EN</option>
                </select>


                <div class="student-avatar">
                    <i class="bi bi-person"></i>
                </div>

            </div>

        </div>



        <!-- TASKS -->

        <div id="studentTasksContainer"></div>



        <!-- EMPTY -->

        <div
            id="noStudentTasks"
            class="content-card text-center py-5 d-none"
        >

            <i
                class="bi bi-clipboard-check"
                style="
                    font-size: 45px;
                    color: #9ca3af;
                "
            ></i>


            <h5
                id="noTasksTitle"
                class="fw-bold mt-3"
            >
                Нет активных заданий
            </h5>


            <p
                id="noTasksText"
                class="text-secondary mb-0"
            >
                Новые тесты появятся здесь
            </p>

        </div>


    </main>

</div>


<script src="js/language.js"></script>
<script src="js/student-tasks.js"></script>

</body>

</html>

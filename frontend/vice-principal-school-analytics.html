<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ADVANTA Pulse — Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
<div class="d-flex min-vh-100">

    <aside class="bg-dark text-white p-3" style="width:250px;min-width:250px;">
        <h4 class="mb-4">ADVANTA <span class="text-primary">Pulse</span></h4>

        <nav class="nav flex-column gap-2">
            <a href="vice-principal-home.html" class="nav-link text-white">
                <i class="bi bi-speedometer2 me-2"></i><span id="navOverview">Обзор</span>
            </a>
            <a href="vice-principal-classes.html" class="nav-link text-white">
                <i class="bi bi-diagram-3 me-2"></i><span id="navClasses">Все классы</span>
            </a>
            <a href="vice-principal-teachers.html" class="nav-link text-white">
                <i class="bi bi-person-badge me-2"></i><span id="navTeachers">Учителя</span>
            </a>
            <a href="vice-principal-tests.html" class="nav-link text-white">
                <i class="bi bi-journal-check me-2"></i><span id="navTests">Тесты</span>
            </a>
            <a href="vice-principal-results.html" class="nav-link text-white">
                <i class="bi bi-clipboard-data me-2"></i><span id="navResults">Результаты</span>
            </a>
            <a href="vice-principal-school-analytics.html" class="nav-link text-white active bg-primary rounded">
                <i class="bi bi-graph-up-arrow me-2"></i><span id="navAnalytics">Аналитика</span>
            </a>
        </nav>
    </aside>

    <main class="flex-grow-1 p-4" style="min-width:0;">
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h2 id="pageTitle">Аналитика школы</h2>
                <p id="pageDescription" class="text-muted">Результаты тестирования по классам</p>
            </div>
            <select id="languageSelect" class="form-select w-auto">
                <option value="ru">RU</option>
                <option value="kz">KZ</option>
                <option value="en">EN</option>
            </select>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card h-100"><div class="card-body">
                    <div id="classesLabel" class="text-muted small">Классов</div>
                    <h3 id="classesCount">0</h3>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card h-100"><div class="card-body">
                    <div id="resultsLabel" class="text-muted small">Выполнений</div>
                    <h3 id="resultsCount">0</h3>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card h-100"><div class="card-body">
                    <div id="averageLabel" class="text-muted small">Средний балл</div>
                    <h3 id="averageScore">—</h3>
                </div></div>
            </div>
            <div class="col-md-3">
                <div class="card h-100"><div class="card-body">
                    <div id="riskLabel" class="text-muted small">Ниже порога</div>
                    <h3 id="riskCount">0</h3>
                </div></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 id="classesTitle" class="mb-3">Успеваемость по классам</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th id="classHeader">Класс</th>
                                <th id="completedHeader">Выполнений</th>
                                <th id="scoreHeader">Средний балл</th>
                                <th id="belowHeader">Ниже порога</th>
                                <th id="actionHeader">Действие</th>
                            </tr>
                        </thead>
                        <tbody id="classesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 id="riskTitle" class="mb-3">Ученики группы риска</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th id="studentHeader">Ученик</th>
                                <th id="riskClassHeader">Класс</th>
                                <th id="riskScoreHeader">Балл</th>
                                <th id="riskTestHeader">Тест</th>
                            </tr>
                        </thead>
                        <tbody id="riskTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/language.js"></script>
<script src="js/vice-principal-school-analytics.js"></script>
</body>
</html>
